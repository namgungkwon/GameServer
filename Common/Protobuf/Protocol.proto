syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

///////////////////////////////////////////////////////
//	Packet
//	C  - Client
//	L  - LoginServer
//  G  - GameServer
///////////////////////////////////////////////////////

///////////////////////////////////////////////////////
//	<	GameServer	>
///////////////////////////////////////////////////////
message CG_ENTER_GAME
{
	uint64 playerId = 1;
}

message GC_ENTER_GAME
{
	bool success = 1;
	ObjectData object= 2;
}


message CG_LEAVE_GAME
{
	uint64 objectId = 1;
}

///////////////////////////////////////////////////////
//	<	Map	>
///////////////////////////////////////////////////////


///////////////////////////////////////////////////////
//	<	Spawn	>
///////////////////////////////////////////////////////
message GC_SPAWN
{
	repeated ObjectData object = 1;
}

message GC_DESPAWN
{
	repeated uint64 objectId = 1;
}

///////////////////////////////////////////////////////
//	<	Move	>
///////////////////////////////////////////////////////
message CG_MOVE
{
	ObjectMoveData moveData = 1;
}

message GC_MOVE
{
	repeated ObjectPosData moveData = 1;
}

