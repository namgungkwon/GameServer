///////////////////////////////////////////////////////
//	<	GameServer	>
///////////////////////////////////////////////////////
message CG_ENTER_GAME
{
	uint64 playerId = 1;
}

message GC_ENTER_GAME
{
	bool success = 1;
	PlayerSummaryData summaryData = 2;
	PlayerPosData posData = 3;
	PlayerStatData statData = 4;
}


message CG_LEAVE_GAME
{
	uint64 objectId = 1;
}

