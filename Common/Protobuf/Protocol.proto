syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

///////////////////////////////////////////////////////
//	Packet
//	C  - Client
//	L  - LoginServer
//  G  - GameServer
///////////////////////////////////////////////////////

///////////////////////////////////////////////////////
//	<	LoginServer	>
///////////////////////////////////////////////////////
message CL_CREATE_ACCOUNT
{
	string					id = 1;
	string					password = 2;
}

message LC_CREATE_ACCOUNT
{
	Result result = 1;
}

message CL_LOGIN
{
	string					id = 1;
	string					password = 2;
}

message LC_LOGIN
{
	Result					 result = 1;
	string					token = 2;
}

///////////////////////////////////////////////////////
//	<	GameServer	>
///////////////////////////////////////////////////////
message CG_AUTH_TOKEN
{
	string token = 1;
}

message GC_AUTH_TOKEN
{
	Result result = 1;
	repeated ObjectSummaryData summaries = 2;
}

message CG_ENTER_GAME
{
	uint64 dbId = 1;
	uint64 playerId = 2;
}

message GC_ENTER_GAME
{
	bool success = 1;
	ObjectData object= 2;
}


message CG_LEAVE_GAME
{
	uint64 objectId = 1;
}

///////////////////////////////////////////////////////
//	<	Map	>
///////////////////////////////////////////////////////


///////////////////////////////////////////////////////
//	<	Spawn	>
///////////////////////////////////////////////////////
message GC_SPAWN
{
	repeated ObjectData object = 1;
}

message GC_DESPAWN
{
	repeated uint64 objectId = 1;
}

message CG_REVIVE
{
	uint64 objectId = 1;
	RespawnOption option = 2;
}

message GC_REVIVE
{
	ObjectPosData posData = 1;
	ObjectStatData statData = 2;
}

///////////////////////////////////////////////////////
//	<	Move	>
///////////////////////////////////////////////////////
message CG_MOVE
{
	ObjectMoveData moveData = 1;
}

message GC_MOVE
{
	repeated ObjectPosData moveData = 1;
}

///////////////////////////////////////////////////////
//	<	Attack	>
///////////////////////////////////////////////////////
message CG_ATTACK
{
	ObjectPosData posData = 1;
	repeated uint64 targets = 2;
	uint64 skillId = 3;
}

message GC_ATTACK
{
	ObjectPosData posData = 1;
	uint64 skillId = 2;
}

message GC_DAMAGE
{
	uint64 objectId = 1;
	uint64 damage = 2;
	bool isDead = 3;
}

message GC_REWARD
{
	uint64 exp = 1;
}

message GC_LEVELUP
{
	ObjectData data = 1;
}

///////////////////////////////////////////////////////
//	<	Chat	>
///////////////////////////////////////////////////////
message CG_CHAT
{
	string chat = 1;
	ChatType type = 2;
}

message GC_CHAT
{
	string name = 1;
	string chat = 2;
}


