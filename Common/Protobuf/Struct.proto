syntax = "proto3";
package Protocol;

import "Enum.proto";


message ServerInfo
{
	ServerType		serverType = 1;
	string			name = 2;
	uint32			currentUsers = 3;
	uint32			maxCapacity = 4;
	ServerStatus	status = 5;
	string			publicIP = 6;
	uint32			publicPort = 7;
}

message ClientInfo
{
	uint64			clientId = 1;
	string			ip = 2;
	uint32			port = 3;
}

message AttackInfo
{
	uint64 attackerId = 1;
	repeated uint64 targetId = 2;
	uint64 skillid = 3;
	Direction dir = 4;

}

message Vector3
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message DamageInfo
{	
	uint64 attackerId = 1;
	uint64 targetId = 2;
	uint64 skillid = 3;
	uint64 damage = 4;
	bool isDead = 5;
}

message ObjectSummaryData
{
	uint64 objectId = 1;
	ObjectCategory objectType = 2;
	string name = 3;
	int32 templateId = 4;
	int32 level = 5;
}

message ObjectPosData
{
	uint64 objectId = 1;
	Vector3 location = 2;
	float yaw = 3;
}

message ObjectStatData
{
	uint64 objectId = 1;
	int64 hp = 2;
	int64 mp = 3;
	int64 exp = 4;
}

message ObjectData
{
	ObjectSummaryData summary = 1;
	ObjectPosData pos = 2;
	ObjectStatData stat = 3;
}

message ObjectMoveData
{
	uint64 objectId = 1;
	Vector3 location = 2;
	Vector3 Velocity = 3;
	float yaw = 4;
}