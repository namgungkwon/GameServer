syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

///////////////////////////////////////////////////////
//	Packet
//	C  - Client
//	L  - LoginServer
//  G  - GameServer
//	M  - Center & DB Server
//  H  - ChatServer
///////////////////////////////////////////////////////
//	REQ  - Request
//  RES  - Respond
///////////////////////////////////////////////////////

///////////////////////////////////////////////////////
//	<	Login	>
///////////////////////////////////////////////////////
message CL_REQ_LOGIN
{
	string		id = 1;
	string		password = 2;
}

message LM_REQ_LOGIN
{
	string		id = 1;
	string		password = 2;
}

message ML_RES_LOGIN
{
	bool					success = 1;
	uint64					token = 2;
}

message LC_RES_LOGIN
{
	bool					success = 1;
	uint64					token = 2;
}

///////////////////////////////////////////////////////
//	<	gameServerList >
///////////////////////////////////////////////////////
message CL_REQ_GAMESERVERLIST
{
	uint64					token = 1;
}

message LM_REQ_GAMESERVERLIST
{
	uint64					token = 2;
}

message ML_RES_GAMESERVERLIST
{
	bool					success = 1;
	GameServerInfo			GameServerInfo = 2;
}

message LC_RES_GAMESERVERLIST
{
	bool					success = 1;
	GameServerInfo			GameServerInfo = 2;
}